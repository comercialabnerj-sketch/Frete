<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Coletas e Carretos</title>
    
    <!-- Bibliotecas para leitura de PDF e geração de PDF local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            margin-top: 0;
            color: #075e54;
        }
        .upload-box {
            border: 2px dashed #075e54;
            background-color: #e8f5e9;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .section-title {
            margin-top: 25px;
            margin-bottom: 8px;
            color: #075e54;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .preview-box {
            background: #e5ddd5;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            margin-top: 6px;
            border: 1px solid #d1c7bd;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
            color: white;
            text-align: center;
        }
        .btn-cliente { background-color: #128c7e; }
        .btn-carreto { background-color: #25d366; }
        .btn-save { background-color: #f0ad4e; }
        .btn-clear { background-color: #d9534f; }
        .btn-pdf { background-color: #0275d8; }
        .btn-semana { background-color: #6f42c1; width: 100%; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }

        /* Estilo para garantir visibilidade e legibilidade na conversão para PDF */
        #pdf-render {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 30px !important;
            font-family: Arial, sans-serif !important;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 Gestão de Coletas e Carretos</h2>

    <!-- Leitor de PDF da Nota Fiscal -->
    <div class="upload-box">
        <label for="pdfFile" style="cursor: pointer; color: #075e54;">📄 <strong>Subir PDF da Nota Fiscal (DANFE)</strong></label>
        <input type="file" id="pdfFile" accept="application/pdf" onchange="lerPDF(this)" style="margin-top: 8px;">
        <small id="uploadStatus" style="display:block; margin-top:5px; color:#666;">Selecione o PDF para preenchimento automático.</small>
    </div>

    <!-- Formulário -->
    <div class="form-group">
        <label for="carreto">Nome do Carreto / Motorista:</label>
        <input type="text" id="carreto" placeholder="Ex: Edmar Transports" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="nf">Nota Fiscal:</label>
        <input type="text" id="nf" placeholder="Ex: 043276" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="cliente">Nome do Cliente:</label>
        <input type="text" id="cliente" placeholder="Ex: Maria José de Sousa Silva" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" placeholder="Ex: (11) 95959-0039" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="endereco">Endereço de Entrega:</label>
        <input type="text" id="endereco" placeholder="Ex: Avenida Paraguacu Paulista, 705" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="bairro">Bairro / Cidade / UF:</label>
        <input type="text" id="bairro" placeholder="Ex: Jardim Ana Estela - Carapicuíba/SP" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="cep">CEP:</label>
        <input type="text" id="cep" placeholder="Ex: 06.364-550" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="data">Data de Retirada / Entrega:</label>
        <input type="text" id="data" placeholder="Ex: 30/09/2026" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="pagamento">Pagamento do Frete:</label>
        <input type="text" id="pagamento" placeholder="Ex: Cliente paga no local R$ 700,00" oninput="gerarMensagens()">
    </div>

    <div class="form-group">
        <label for="obs">Observações:</label>
        <textarea id="obs" placeholder="Ex: Retirada Edmar 152 presilhas internas" oninput="gerarMensagens()"></textarea>
    </div>

    <!-- BOTÕES DE AÇÃO DO FORMULÁRIO -->
    <div class="btn-group">
        <button class="btn btn-save" onclick="salvarNaPlanilha()">💾 Guardar na Planilha</button>
        <button class="btn btn-clear" onclick="limparFormulario()">🗑️ Limpar Campos</button>
    </div>

    <!-- MENSAGENS E PDF -->
    <div class="section-title">📱 Mensagem 1: Para o Cliente</div>
    <div class="preview-box" id="previewCliente"></div>
    <div class="btn-group">
        <button class="btn btn-cliente" onclick="copiarTexto('cliente')">Copiar p/ Cliente</button>
    </div>

    <div class="section-title">🚛 Mensagem 2: Para o Carreto (Completa)</div>
    <div class="preview-box" id="previewCarreto"></div>
    <div class="btn-group">
        <button class="btn btn-carreto" onclick="copiarTexto('carreto')">Copiar p/ Carreto</button>
        <button class="btn btn-pdf" onclick="gerarPDF()">Baixar PDF</button>
    </div>

    <div class="section-title">📊 Relatório Semanal</div>
    <button class="btn btn-semana" onclick="copiarRelatorioSemanal()">📋 Copiar Entregas da Semana Toda</button>
</div>

<!-- Elemento para renderização limpa do PDF -->
<div id="pdf-container" style="display: none;">
    <div id="pdf-render">
        <h2 style="text-align: center; color: #075e54; border-bottom: 2px solid #075e54; padding-bottom: 10px;">Solicitação de Coleta / Carreto</h2>
        <div id="pdf-body" style="font-size: 14px; line-height: 1.6; margin-top: 20px;"></div>
    </div>
</div>

<script>
// URL DO GOOGLE APPS SCRIPT CONFIGURADA
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiB2HGjI99va6sajy7MBYiRzLyuV7eFUfiFRNyr5_P1bSwesgv3m_WfFNvPLz5qRV8/exec";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

function obterDados() {
    return {
        carreto: document.getElementById('carreto').value.trim(),
        nf: document.getElementById('nf').value.trim(),
        cliente: document.getElementById('cliente').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        endereco: document.getElementById('endereco').value.trim(),
        bairro: document.getElementById('bairro').value.trim(),
        cep: document.getElementById('cep').value.trim(),
        data: document.getElementById('data').value.trim(),
        pagamento: document.getElementById('pagamento').value.trim(),
        obs: document.getElementById('obs').value.trim()
    };
}

function gerarTextoCliente() {
    const d = obterDados();
    let msg = `Olá${d.cliente ? ' *' + d.cliente + '*' : ''}! 👋\nSua entrega foi agendada com sucesso. Confira os dados:\n\n`;
    msg += `📦 *STATUS: COLETA AGENDADA*\n\n`;
    if (d.data) msg += `📅 *Data Agendada:* ${d.data}\n`;
    if (d.nf) msg += `📄 *Nota Fiscal:* ${d.nf}\n`;
    if (d.carreto) msg += `🚚 *Carreto:* ${d.carreto}\n`;
    if (d.endereco || d.bairro || d.cep) {
        msg += `\n📍 *Endereço de Entrega:*\n`;
        if (d.endereco) msg += `${d.endereco}\n`;
        if (d.bairro) msg += `${d.bairro}\n`;
        if (d.cep) msg += `CEP: ${d.cep}\n`;
    }
    msg += `\nQualquer dúvida, estamos à disposição!😊`;
    return msg.trim();
}

function gerarTextoCarreto() {
    const d = obterDados();
    let msg = `🚚 *SOLICITAÇÃO DE COLETA / CARRETO*\n\n`;
    if (d.carreto) msg += `🚛 *Carreto:* ${d.carreto}\n`;
    if (d.nf) msg += `📄 *Nota Fiscal:* ${d.nf}\n`;
    if (d.cliente) msg += `👤 *Cliente:* ${d.cliente}\n`;
    if (d.telefone) msg += `📞 *Telefone:* ${d.telefone}\n`;
    if (d.endereco || d.bairro || d.cep) {
        msg += `\n📍 *Endereço de Entrega:*\n`;
        if (d.endereco) msg += `${d.endereco}\n`;
        if (d.bairro) msg += `${d.bairro}\n`;
        if (d.cep) msg += `CEP: ${d.cep}\n`;
    }
    if (d.data) msg += `\n📅 *Data de Retirada:* ${d.data}\n`;
    if (d.pagamento) msg += `💰 *Pagamento do Frete:* ${d.pagamento}\n`;
    if (d.obs) msg += `\n📝 *Observações:*\n${d.obs}\n`;
    return msg.trim();
}

function gerarMensagens() {
    document.getElementById('previewCliente').innerText = gerarTextoCliente();
    document.getElementById('previewCarreto').innerText = gerarTextoCarreto();
}

function copiarTexto(tipo) {
    const texto = tipo === 'cliente' ? gerarTextoCliente() : gerarTextoCarreto();
    navigator.clipboard.writeText(texto).then(() => {
        alert(`Mensagem copiada com sucesso!`);
    });
}

function limparFormulario() {
    document.querySelectorAll('input, textarea').forEach(el => el.value = '');
    document.getElementById('uploadStatus').innerText = 'Selecione o PDF para preenchimento automático.';
    document.getElementById('uploadStatus').style.color = '#666';
    gerarMensagens();
}

function gerarPDF() {
    const pdfContainer = document.getElementById('pdf-container');
    const pdfBody = document.getElementById('pdf-body');
    
    pdfBody.innerHTML = gerarTextoCarreto()
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

    pdfContainer.style.display = 'block';

    const element = document.getElementById('pdf-render');
    const nfNum = document.getElementById('nf').value.trim() || 'Coleta';

    const opt = {
        margin:       10,
        filename:     `Coleta_NF_${nfNum}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, logging: false, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        pdfContainer.style.display = 'none';
    });
}

async function salvarNaPlanilha() {
    const d = obterDados();
    if (!d.nf && !d.cliente) {
        alert("Preencha ao menos o nome do cliente ou número da NF.");
        return;
    }

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'salvar', dados: d })
        });
        alert("Dados salvos na planilha com sucesso!");
    } catch (e) {
        alert("Erro ao salvar os dados na planilha.");
    }
}

async function copiarRelatorioSemanal() {
    try {
        const response = await fetch(SCRIPT_URL);
        const dados = await response.json();

        if (!dados || dados.length === 0) {
            alert("Nenhuma entrega registrada na planilha.");
            return;
        }

        let relatorio = `📋 *RESUMO DE ENTREGAS DA SEMANA*\n\n`;

        dados.forEach((row, index) => {
            relatorio += `*#${index + 1} - NF: ${row[1] || 'S/N'}*\n`;
            if (row[0]) relatorio += `📅 Data: ${row[0]}\n`;
            if (row[2]) relatorio += `👤 Cliente: ${row[2]}\n`;
            if (row[4]) relatorio += `📍 Endereço: ${row[4]}, ${row[5]}\n`;
            if (row[7]) relatorio += `🚚 Carreto: ${row[7]}\n`;
            if (row[8]) relatorio += `💰 Valor: ${row[8]}\n`;
            relatorio += `-----------------------------\n`;
        });

        navigator.clipboard.writeText(relatorio).then(() => {
            alert("Resumo de entregas da semana copiado para a área de transferência!");
        });
    } catch (e) {
        alert("Erro ao buscar dados da planilha.");
    }
}

async function lerPDF(input) {
    const file = input.files[0];
    const status = document.getElementById('uploadStatus');

    if (!file) return;

    status.innerText = "Lendo Nota Fiscal...";
    status.style.color = "#0275d8";

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        fullText += textContent.items.map(item => item.str).join(" ") + " ";
    }

    const nfMatch = fullText.match(/N[º°]\s*(\d{6})/i);
    const clienteMatch = fullText.match(/DESTINATÁRIO\/REMETENTE[\s\S]*?NOME\/RAZÃO SOCIAL\s*([A-Za-zÀ-ÿ\s]+?)(?=\s*CNPJ|\s*ENDEREÇO)/i);
    const enderecoMatch = fullText.match(/ENDEREÇO\s*([A-Za-zÀ-ÿ0-9\s,\.-]+?)(?=\s*BAIRRO|\s*MUNICIPIO)/i);
    const bairroMatch = fullText.match(/BAIRRO\s*([A-Za-zÀ-ÿ0-9\s]+?)(?=\s*UF|\s*CEP)/i);
    const municipioMatch = fullText.match(/MUNICIPIO\s*([A-Za-zÀ-ÿ\s]+?)(?=\s*UF|\s*INSC)/i);
    const ufMatch = fullText.match(/UF\s*([A-Z]{2})/);
    const cepMatch = fullText.match(/\d{2}\.\d{3}-\d{3}|\d{8}/);
    const foneMatch = fullText.match(/\(\d{2}\)\s*\d{4,5}-\d{4}/);
    const dataMatch = fullText.match(/DATA\s*EMISSÃO\s*(\d{2}\/\d{2}\/\d{4})/i) || fullText.match(/(\d{2}\/\d{2}\/\d{4})/);

    if (nfMatch) document.getElementById('nf').value = nfMatch[1];
    if (clienteMatch) document.getElementById('cliente').value = clienteMatch[1].trim();
    if (enderecoMatch) document.getElementById('endereco').value = enderecoMatch[1].trim();
    
    let bairroCompleto = "";
    if (bairroMatch) bairroCompleto += bairroMatch[1].trim();
    if (municipioMatch) bairroCompleto += (bairroCompleto ? " - " : "") + municipioMatch[1].trim();
    if (ufMatch) bairroCompleto += "/" + ufMatch[1].trim();
    if (bairroCompleto) document.getElementById('bairro').value = bairroCompleto;

    if (cepMatch) document.getElementById('cep').value = cepMatch[0];
    if (foneMatch) document.getElementById('telefone').value = foneMatch[0];
    if (dataMatch) document.getElementById('data').value = dataMatch[1];

    status.innerText = "Dados extraídos com sucesso!";
    status.style.color = "#25d366";

    gerarMensagens();
}

gerarMensagens();
</script>

</body>
</html>
